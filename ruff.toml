target-version = "py310"
line-length = 100
src = ["micronaut", "tools", "flat", "field"]

[lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E501",   # line too long — handled by formatter
  "F401",   # unused import — many intentional re-exports in this codebase
]

[lint.per-file-ignores]
"tests/**" = ["F811"]   # redefinition of unused name from import — common in test helpers
